version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

# Note: MongoDB is expected to be MongoDB Atlas (cloud) via MONGODB_URI in
# backend/.env. If you'd rather run Mongo locally, add a `mongo` service
# here and point MONGODB_URI to it.
